events {
    worker_connections 1024;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Upstream definitions (backend servers)
    upstream app1_backend {
        server app1:3000;
    }

    upstream app2_backend {
        server app2:5000;
    }

    upstream app3_backend {
        server app3:80;
    }

    server {
        listen 80;
        server_name localhost;
        
        # Serve landing page from mounted file
        root /etc/nginx/html;
        index landing-page-path.html;

        # Root location - Landing page
        location = / {
            try_files /landing-page-path.html =404;
        }

        # App 1 - Node.js Application
        location /app1/ {
            proxy_pass http://app1_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # App 2 - Python Flask Application
        location /app2/ {
            proxy_pass http://app2_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # App 3 - Static Site
        location /app3/ {
            proxy_pass http://app3_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
