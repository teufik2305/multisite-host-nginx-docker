events {
    worker_connections 1024;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Upstream definitions (backend servers)
    upstream app1_backend {
        server app1:3000;
    }

    upstream app2_backend {
        server app2:5000;
    }

    upstream app3_backend {
        server app3:80;
    }

    # =================================================================
    # Server Block 1: Node.js Application
    # Domain: webhostingpracticenode.com
    # =================================================================
    server {
        listen 80;
        server_name webhostingpracticenode.com www.webhostingpracticenode.com;

        # Logging for this specific domain
        access_log /var/log/nginx/app1_access.log;
        error_log /var/log/nginx/app1_error.log;

        # Root location - serves the entire app
        location / {
            proxy_pass http://app1_backend/;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://app1_backend/;
        }
    }

    # =================================================================
    # Server Block 2: Python Flask Application
    # Domain: webhostingpracticepython.com
    # =================================================================
    server {
        listen 80;
        server_name webhostingpracticepython.com www.webhostingpracticepython.com;

        # Logging for this specific domain
        access_log /var/log/nginx/app2_access.log;
        error_log /var/log/nginx/app2_error.log;

        # Root location
        location / {
            proxy_pass http://app2_backend/;
            proxy_http_version 1.1;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # =================================================================
    # Server Block 3: Static HTML Site
    # Domain: webhostingpracticestatic.com
    # =================================================================
    server {
        listen 80;
        server_name webhostingpracticestatic.com www.webhostingpracticestatic.com;

        # Logging for this specific domain
        access_log /var/log/nginx/app3_access.log;
        error_log /var/log/nginx/app3_error.log;

        # Root location
        location / {
            proxy_pass http://app3_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Cache static content
            proxy_cache_valid 200 1h;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    # =================================================================
    # Default Server Block (Catch-all for localhost or unknown domains)
    # =================================================================
    server {
        listen 80 default_server;
        server_name localhost _;
        
        # Serve landing page from mounted file
        root /etc/nginx/html;
        index landing-page-dns.html;

        # Landing page showing all available apps
        location = / {
            try_files /landing-page-dns.html =404;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Show nginx status (optional, for debugging)
        location /nginx-status {
            stub_status on;
            access_log off;
        }
    }
}

